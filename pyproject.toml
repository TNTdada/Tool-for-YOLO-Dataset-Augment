[project]
name = "yolo-dataset-augmenter-desktop"
version = "3.0.0"
description = "PyQt6 desktop UI for YOLO dataset augmentation and packaging."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<5",
  "pillow>=10,<13",
  "PyQt6>=6.6,<7",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
